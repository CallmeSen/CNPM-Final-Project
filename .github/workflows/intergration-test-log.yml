name: Integration Test Log

on:
  push:
    branches:
      - main
      - source
    paths:
      - 'backend/**'
      - '.github/workflows/intergration-test-log.yml'
  pull_request:
    branches:
      - main
      - source
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  setup-infrastructure:
    name: Start Docker Compose Stack
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        shell: powershell
        run: |
          Write-Host "Checking CNPM Docker Compose stack..." -ForegroundColor Cyan
          
          # Check if containers are already running
          $running = docker-compose -p cnpm-final-project ps -q 2>$null | Out-String
          
          if ($running) {
            Write-Host "Stack already running, checking health..." -ForegroundColor Green
            docker-compose -p cnpm-final-project ps
          } else {
            Write-Host "Starting Docker Compose stack..." -ForegroundColor Yellow
            docker-compose -p cnpm-final-project up -d mongodb mongodb-restaurant mongodb-order mongodb-payment redis kafka zookeeper
            
            Write-Host "`nWaiting for services to be ready..." -ForegroundColor Cyan
            Start-Sleep -Seconds 15
          }
          
          Write-Host "`nDocker Compose Services Status:" -ForegroundColor Cyan
          docker-compose -p cnpm-final-project ps
          
          Write-Host "`nMongoDB Health Check:" -ForegroundColor Cyan
          docker ps --filter "name=mongodb" --format "table {{.Names}}\t{{.Status}}"

  auth-integration-test:
    name: Auth Service Integration Test
    runs-on: self-hosted
    needs: setup-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: backend/auth-service
        run: npm ci

      - name: Run Integration Tests
        working-directory: backend/auth-service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Starting Auth Service Integration Tests..." -ForegroundColor Cyan
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          Write-Host "[$timestamp] Test execution started" -ForegroundColor Green
          
          # Run tests and capture all output
          $logFile = "auth-integration-test.log"
          npm run test:integration *>&1 | ForEach-Object {
            $_ | Out-File -FilePath $logFile -Append -Encoding utf8
            Write-Host $_
          }
          
          $exitCode = $LASTEXITCODE
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          
          if ($exitCode -eq 0) {
            $status = "PASSED"
            $color = "Green"
          } else {
            $status = "FAILED"
            $color = "Red"
          }
          
          $statusMsg = "[$timestamp] Auth tests $status (exit code: $exitCode)"
          Write-Host $statusMsg -ForegroundColor $color
          $statusMsg | Out-File -FilePath $logFile -Append -Encoding utf8
          
          if ($exitCode -ne 0) { exit $exitCode }
        continue-on-error: true

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integration-logs
          path: backend/auth-service/auth-integration-test.log
          retention-days: 7

      - name: Push Auth Logs to Loki
        if: always()
        shell: powershell
        working-directory: backend/auth-service
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
        run: |
          if (-not $env:LOKI_URL) {
            Write-Host "⚠️  LOKI_URL not configured, skipping log export" -ForegroundColor Yellow
            exit 0
          }
          
          if (-not (Test-Path "auth-integration-test.log")) {
            Write-Host "⚠️  Log file not found" -ForegroundColor Yellow
            exit 0
          }
          
          Write-Host "📤 Pushing Auth Service logs to Loki..." -ForegroundColor Cyan
          
          # Generate Loki payload using Python
          $pythonScript = @'
          import json
          import os
          import time
          import sys
          from pathlib import Path
          
          log_file = "auth-integration-test.log"
          if not Path(log_file).exists():
              print(f"Log file {log_file} not found")
              sys.exit(0)
          
          test_status = "unknown"
          with open(log_file, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()
              if "PASSED" in content:
                  test_status = "passed"
              elif "FAILED" in content:
                  test_status = "failed"
          
          labels = {
              "job": "integration-tests",
              "service": "auth",
              "repo": os.environ.get("GITHUB_REPOSITORY", "unknown"),
              "workflow": os.environ.get("GITHUB_WORKFLOW", "unknown"),
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME", "unknown"),
              "commit": os.environ.get("GITHUB_SHA", "unknown")[:7],
              "test_status": test_status,
              "log_type": "integration-test",
              "environment": "ci"
          }
          
          values = []
          base_ts = int(time.time() * 1e9)
          
          with open(log_file, "r", encoding="utf-8", errors="ignore") as f:
              for idx, line in enumerate(f):
                  ts = str(base_ts + idx * 1000)
                  values.append([ts, line.rstrip()])
          
          payload = {
              "streams": [{
                  "stream": labels,
                  "values": values
              }]
          }
          
          with open("loki-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          
          print(f"✓ Prepared {len(values)} log lines for Loki (status: {test_status})")
          '@
          
          $pythonScript | python
          
          if (-not (Test-Path "loki-payload.json")) {
            Write-Host "❌ Failed to generate payload" -ForegroundColor Red
            exit 1
          }
          
          # Prepare curl authentication
          $curlAuth = @()
          if ($env:LOKI_USERNAME) {
            $curlAuth = @("-u", "${env:LOKI_USERNAME}:${env:LOKI_PASSWORD}")
          }
          
          # Push to Loki
          $response = curl -sS -w "`n%{http_code}" -X POST @curlAuth `
            -H "Content-Type: application/json" `
            $env:LOKI_URL `
            --data-binary "@loki-payload.json" 2>&1
          
          $lines = $response -split "`n"
          $httpCode = $lines[-1]
          
          if ($httpCode -eq "204" -or $httpCode -eq "200") {
            Write-Host "✅ Successfully pushed Auth logs to Loki (HTTP $httpCode)" -ForegroundColor Green
          } else {
            Write-Host "❌ Failed to push logs (HTTP $httpCode)" -ForegroundColor Red
            Write-Host "Response: $($lines[0..$($lines.Length-2)] -join "`n")"
            exit 1
          }

