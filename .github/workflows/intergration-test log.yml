          Write-Host "[$timestamp] Test execution started" -ForegroundColor Green
          
          npm run test:integration 2>&1 | Tee-Object -FilePath "payment-integration-test.log"
          $exitCode = $LASTEXITCODE
          
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          if ($exitCode -eq 0) {
            Write-Host "[$timestamp] Payment tests completed successfully" -ForegroundColor Green
          } else {
            Write-Host "[$timestamp] Payment tests failed with exit code: $exitCode" -ForegroundColor Red
          }
          
          exit $exitCode
        continue-on-error: false

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-integration-logs
          path: backend/payment-service/payment-integration-test.log
          retention-days: 7

  export-logs:
    name: Export Integration Logs to Loki
    runs-on: ubuntu-latest
    needs:
      - auth-integration-test
      - restaurant-integration-test
      - order-integration-test
      - payment-integration-test
    if: always()
    env:
      LOKI_URL: ${{ secrets.LOKI_URL }}
      LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
      LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
    steps:
      - name: Download All Test Logs
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: test-logs/

      - name: Prepare and Push Logs to Loki
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          echo "=== Collected Test Logs ==="
          find test-logs -type f -name "*.log" || echo "No log files found"
          
          if [ -z "$LOKI_URL" ]; then
            echo "LOKI_URL not configured, skipping log export"
            exit 0
          fi
          
          # Collect test artifact logs
          mkdir -p logs
          for log in test-logs/*/*.log; do
            if [ -f "$log" ]; then
              service_name=$(basename $(dirname "$log") | sed 's/-integration-logs//')
              cp "$log" "logs/${service_name}-test.log"
              echo "Collected: $log -> logs/${service_name}-test.log"
            fi
          done
          
          # Also fetch GitHub Actions job logs
          echo "Fetching GitHub Actions job logs for run ${GITHUB_RUN_ID}"
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs --paginate --jq '.jobs[] | "\(.id)|\(.name)"' > logs/jobs.txt || true

          if [ -s logs/jobs.txt ]; then
            while IFS="|" read -r job_id job_name; do
              echo "Downloading logs for job ${job_id} (${job_name})"
              gh api repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs > logs/${job_id}.zip 2>/dev/null || true
              if [ -f logs/${job_id}.zip ]; then
                unzip -p logs/${job_id}.zip > logs/${job_id}.log 2>/dev/null || true
                echo "${job_id}|${job_name}" >> logs/job_meta.txt
              fi
            done < logs/jobs.txt
          fi

          # Generate Loki payload
          python3 - <<'EOF'
          import json
          import os
          import time
          from pathlib import Path
          from datetime import datetime

          repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
          workflow = os.environ.get("GITHUB_WORKFLOW", "unknown")
          workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "unknown")
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "unknown")
          branch = os.environ.get("GITHUB_REF_NAME", "unknown")
          commit = os.environ.get("GITHUB_SHA", "unknown")[:7]

          # Load job metadata
          meta = {}
          meta_path = Path("logs/job_meta.txt")
          if meta_path.exists():
              with meta_path.open() as f:
                  for line in f:
                      if "|" in line:
                          job_id, job_name = line.strip().split("|", 1)
                          meta[job_id] = job_name

          streams = []
          
          # Process all log files
          for log_path in Path("logs").glob("*.log"):
              job_id = log_path.stem
              job_name = meta.get(job_id, job_id)
              
              # Determine if this is a test log or workflow log
              log_type = "test" if "-test" in str(log_path) else "workflow"
              service = job_name.replace("-integration-logs", "").replace(" Service Integration Test", "").strip()
              
              labels = {
                  "job": "integration-tests",
                  "repo": repo,
                  "workflow": workflow,
                  "workflow_ref": workflow_ref,
                  "run_id": run_id,
                  "run_number": run_number,
                  "branch": branch,
                  "commit": commit,
                  "job_id": job_id,
                  "job_name": job_name,
                  "log_type": log_type,
                  "service": service,
                  "environment": "ci"
              }

              values = []
              base_ts = int(time.time() * 1e9)
              
              try:
                  with log_path.open(encoding='utf-8', errors='ignore') as f:
                      for idx, line in enumerate(f):
                          ts = str(base_ts + idx * 1000)  # 1ms apart
                          values.append([ts, line.rstrip()])
              except Exception as e:
                  print(f"Error reading {log_path}: {e}")
                  continue

              if values:
                  streams.append({"stream": labels, "values": values})
                  print(f"Added {len(values)} log lines from {log_path.name} (service: {service})")

          if streams:
              payload = {"streams": streams}
              with open("payload.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, indent=2)
              print(f"\n=== Prepared {len(streams)} log streams for Loki ===")
          else:
              Path("payload.json").write_text("{}", encoding="utf-8")
              print("No log streams to export")
          EOF

          # Push to Loki
          if [ ! -s payload.json ] || [ "$(cat payload.json)" = "{}" ]; then
            echo "No log data to push to Loki"
            exit 0
          fi

          CURL_AUTH=""
          if [ -n "${LOKI_USERNAME:-}" ]; then
            CURL_AUTH="--user ${LOKI_USERNAME}:${LOKI_PASSWORD}"
          fi

          echo "Pushing logs to Loki at ${LOKI_URL}"
          response=$(curl -sS -w "\n%{http_code}" -X POST ${CURL_AUTH} \
            -H "Content-Type: application/json" \
            "${LOKI_URL%/}/loki/api/v1/push" \
            --data-binary "@payload.json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          if [ "$http_code" = "204" ] || [ "$http_code" = "200" ]; then
            echo "✓ Successfully pushed logs to Loki (HTTP $http_code)"
          else
            echo "✗ Failed to push logs to Loki (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
