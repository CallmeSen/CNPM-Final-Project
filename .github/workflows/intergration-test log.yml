          path: backend/order-service/order-integration-test.log
          retention-days: 7

  payment-integration-test:
    name: Payment Service Integration Test
    runs-on: self-hosted
    needs: setup-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: backend/payment-service
        run: npm ci

      - name: Run Integration Tests
        working-directory: backend/payment-service
        shell: powershell
        run: |
          Write-Host "Starting Payment Service Integration Tests..." -ForegroundColor Cyan
