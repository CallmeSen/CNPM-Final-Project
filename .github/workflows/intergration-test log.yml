name: Integration Test

on:
  push:
    branches:
      - main
      - source
    paths:
      - 'backend/**'
      - '.github/workflows/integration-test copy.yml'
  pull_request:
    branches:
      - main
      - source
    paths:
      - 'backend/**'
  workflow_run:
    workflows:
      - backend-ci
    types:
      - completed

jobs:
  setup-infrastructure:
    name: Start Docker Compose Stack
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        shell: powershell
        run: |
          Write-Host "Checking CNPM Docker Compose stack..." -ForegroundColor Cyan
          
          # Check if containers are already running
          $running = docker-compose -p cnpm-final-project ps -q 2>$null | Out-String
          
          if ($running) {
            Write-Host "Stack already running, checking health..." -ForegroundColor Green
            docker-compose -p cnpm-final-project ps
          } else {
            Write-Host "Starting Docker Compose stack..." -ForegroundColor Yellow
            docker-compose -p cnpm-final-project up -d mongodb mongodb-restaurant mongodb-order mongodb-payment redis kafka zookeeper
            
            Write-Host "`nWaiting for services to be ready..." -ForegroundColor Cyan
            Start-Sleep -Seconds 15
          }
          
          Write-Host "`nDocker Compose Services Status:" -ForegroundColor Cyan
          docker-compose -p cnpm-final-project ps
          
          Write-Host "`nMongoDB Health Check:" -ForegroundColor Cyan
          docker ps --filter "name=mongodb" --format "table {{.Names}}\t{{.Status}}"

  auth-integration-test:
    name: Auth Service Integration Test
    runs-on: self-hosted
    needs: setup-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: backend/auth-service
        run: npm ci

      - name: Run Integration Tests
        working-directory: backend/auth-service
        shell: powershell
        run: |
          Write-Host "Starting Auth Service Integration Tests..." -ForegroundColor Cyan
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          Write-Host "[$timestamp] Test execution started" -ForegroundColor Green
          
          npm run test:integration 2>&1 | Tee-Object -FilePath "auth-integration-test.log"
          $exitCode = $LASTEXITCODE
          
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          if ($exitCode -eq 0) {
            Write-Host "[$timestamp] Auth tests completed successfully" -ForegroundColor Green
          } else {
            Write-Host "[$timestamp] Auth tests failed with exit code: $exitCode" -ForegroundColor Red
          }
          
          exit $exitCode
        continue-on-error: false

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integration-logs
          path: backend/auth-service/auth-integration-test.log
          retention-days: 7

  restaurant-integration-test:
    name: Restaurant Service Integration Test
    runs-on: self-hosted
    needs: setup-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: backend/restaurant-service
        run: npm ci

      - name: Run Integration Tests
        working-directory: backend/restaurant-service
        shell: powershell
        env:
          MONGO_RESTAURANT_URL: mongodb://restaurant:restaurant123@localhost:28017/Restaurant
          JWT_SECRET: test-secret
        run: |
          Write-Host "Starting Restaurant Service Integration Tests..." -ForegroundColor Cyan
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          Write-Host "[$timestamp] Test execution started" -ForegroundColor Green
          
          npm run test:integration 2>&1 | Tee-Object -FilePath "restaurant-integration-test.log"
          $exitCode = $LASTEXITCODE
          
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          if ($exitCode -eq 0) {
            Write-Host "[$timestamp] Restaurant tests completed successfully" -ForegroundColor Green
          } else {
            Write-Host "[$timestamp] Restaurant tests failed with exit code: $exitCode" -ForegroundColor Red
          }
          
          exit $exitCode
        continue-on-error: false

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-integration-logs
          path: backend/restaurant-service/restaurant-integration-test.log
          retention-days: 7

  order-integration-test:
