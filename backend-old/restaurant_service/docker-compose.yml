version: "3.8"

services:

  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./uploads:/app/uploads
    environment:
      # In local dev we point at our local mongo container:
      - MONGO_URI=mongodb://localhost:28017/Restaurant
      # - MONGO_URI=mongodb://mongo:27017/Restaurant
      - PORT=5002
      - JWT_SECRET=<jwt-secret-redacted>