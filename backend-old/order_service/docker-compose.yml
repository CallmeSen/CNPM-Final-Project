version: "3.8"

services:

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      # In local dev we point at our local mongo container:
      - MONGO_URI=mongodb://localhost:28017/Order
      # - MONGO_URI=mongodb://mongo:27017/Order
      - PORT=5005
      - JWT_SECRET=<jwt-secret-redacted>