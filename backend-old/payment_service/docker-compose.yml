version: "3.8"

services:

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      # In local dev we point at our local mongo container:
      - MONGO_URI=mongodb://localhost:28017/Payment
      # - MONGO_URI=mongodb://mongo:27017/Payment
      - PORT=5004
      - JWT_SECRET=<jwt-secret-redacted>

      - STRIPE_SECRET_KEY=***REMOVED***
      - STRIPE_WEBHOOK_SECRET=<stripe-webhook-secret-redacted>

      - TWILIO_ACCOUNT_SID=<twilio-account-sid-redacted>
      - TWILIO_AUTH_TOKEN=<twilio-auth-token-redacted>
      - TWILIO_PHONE_NUMBER=+84356439617

      - RESEND_API_KEY=<resend-api-key-redacted>
