---
- name: Configure Kubernetes worker nodes
  hosts: worker
  become: true
  gather_facts: true

  vars:
    kubernetes_version_channel: v1.30
    kubernetes_repo_key: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_channel }}/deb/Release.key"
    kubernetes_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_channel }}/deb/ /"
    kubeadm_join_command: ""

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - containerd
          - curl
          - docker.io
          - gnupg
        state: present
        update_cache: true

    - name: Load Kubernetes kernel modules on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Configure Kubernetes sysctl values
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl values
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Configure Docker cgroup driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "exec-opts": ["native.cgroupdriver=systemd"]
          }
      notify: Restart Docker

    - name: Enable Docker and containerd
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - containerd

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd for systemd cgroups
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: "0644"
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
      notify: Restart containerd

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes APT key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repo_key }}"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "{{ kubernetes_repo }}"
        filename: kubernetes
        state: present

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubeadm
          - kubelet
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true

    - name: Join Kubernetes cluster when a join command is provided
      ansible.builtin.command: "{{ kubeadm_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      when: kubeadm_join_command | length > 0

    - name: Show join command hint
      ansible.builtin.debug:
        msg: Run the master playbook first, then pass its kubeadm join command with -e kubeadm_join_command='...'.
      when: kubeadm_join_command | length == 0

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
