---
- name: Configure Prometheus, node_exporter, and Grafana
  hosts: monitoring
  become: true
  gather_facts: true

  vars:
    prometheus_version: 2.52.0
    node_exporter_version: 1.8.1
    install_grafana: true

  tasks:
    - name: Upload monitoring installer
      ansible.builtin.copy:
        src: ./configuration_monitoring.sh
        dest: /tmp/configuration_monitoring.sh
        mode: "0755"

    - name: Run monitoring installer
      ansible.builtin.command: /tmp/configuration_monitoring.sh
      environment:
        PROMETHEUS_VERSION: "{{ prometheus_version }}"
        NODE_EXPORTER_VERSION: "{{ node_exporter_version }}"
        INSTALL_GRAFANA: "{{ install_grafana | ternary('true', 'false') }}"
