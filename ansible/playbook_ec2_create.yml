---
- name: Provision EC2 nodes for the CNPM DevOps lab
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - amazon.aws

  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
    ec2_instance_type: "{{ lookup('env', 'EC2_INSTANCE_TYPE') | default('t3.medium', true) }}"
    ec2_image_id: "{{ lookup('env', 'EC2_IMAGE_ID') | default('', true) }}"
    ec2_key_name: "{{ lookup('env', 'EC2_KEY_NAME') | default('', true) }}"
    ec2_instance_count: "{{ lookup('env', 'EC2_INSTANCE_COUNT') | default('3', true) | int }}"
    ec2_security_group_name: "{{ lookup('env', 'EC2_SECURITY_GROUP_NAME') | default('cnpm-devops-lab', true) }}"
    ec2_allowed_cidr: "{{ lookup('env', 'EC2_ALLOWED_CIDR') | default('0.0.0.0/0', true) }}"
    ec2_name_prefix: "{{ lookup('env', 'EC2_NAME_PREFIX') | default('cnpm-devops', true) }}"
    ec2_volume_size: "{{ lookup('env', 'EC2_VOLUME_SIZE') | default('30', true) | int }}"
    ec2_open_ports:
      - 22
      - 80
      - 443
      - 3000
      - 8080
      - 9090
      - 9100
    ec2_tags:
      Project: CNPM-Final-Project
      ManagedBy: Ansible
      Environment: lab

  pre_tasks:
    - name: Validate required EC2 inputs
      ansible.builtin.assert:
        that:
          - ec2_image_id | length > 0
          - ec2_key_name | length > 0
        fail_msg: Set EC2_IMAGE_ID and EC2_KEY_NAME before running this playbook.

    - name: Show public security-group warning
      ansible.builtin.debug:
        msg: EC2_ALLOWED_CIDR is 0.0.0.0/0. Restrict it to your IP before sharing this repo or running in a real account.
      when: ec2_allowed_cidr == '0.0.0.0/0'

  tasks:
    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ ec2_security_group_name }}"
        description: Security group for CNPM DevOps lab nodes
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: "{{ ec2_open_ports }}"
            cidr_ip: "{{ ec2_allowed_cidr }}"
            rule_desc: CNPM lab access
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
        tags: "{{ ec2_tags }}"
      register: ec2_security_group

    - name: Launch EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ ec2_name_prefix }}"
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ec2_image_id }}"
        region: "{{ aws_region }}"
        security_groups:
          - "{{ ec2_security_group_name }}"
        count: "{{ ec2_instance_count }}"
        wait: true
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ ec2_volume_size }}"
              delete_on_termination: true
        tags: "{{ ec2_tags }}"
      register: ec2_nodes

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        state: started
        timeout: 300
      loop: "{{ ec2_nodes.instances }}"
      when: item.public_ip_address is defined

    - name: Print provisioned instance details
      ansible.builtin.debug:
        msg: "{{ ec2_nodes.instances | map(attribute='public_ip_address') | list }}"
